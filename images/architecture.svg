<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f2330"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#60a5fa"/>
    </marker>
    <style>
      .title{font:700 26px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; fill:#e5e7eb}
      .subtitle{font:500 14px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; fill:rgba(229,231,235,0.75)}
      .h{font:700 16px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; fill:#e5e7eb}
      .t{font:500 13px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; fill:rgba(229,231,235,0.82)}
      .mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace; fill:rgba(229,231,235,0.9)}
      .box{fill:rgba(255,255,255,0.06); stroke:rgba(255,255,255,0.14); stroke-width:1.2; rx:16; filter:url(#shadow)}
      .chip{fill:rgba(255,255,255,0.08); stroke:rgba(255,255,255,0.14); stroke-width:1; rx:999}
      .arrow{stroke:#60a5fa; stroke-width:3; fill:none; marker-end:url(#arrow)}
      .dashed{stroke:#22c55e; stroke-width:3; fill:none; stroke-dasharray:8 8; marker-end:url(#arrow)}
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="760" fill="url(#bg)"/>

  <text x="60" y="70" class="title">RosettaFold3 蛋白质实验室（Demo 架构）</text>
  <text x="60" y="98" class="subtitle">UI 运行在 CPU Container App；推理服务运行在 A100 GPU Container App；两者通过 HTTP 通信</text>

  <!-- User -->
  <rect x="70" y="150" width="320" height="130" class="box"/>
  <text x="95" y="185" class="h">用户浏览器</text>
  <text x="95" y="210" class="t">访问 UI 站点</text>
  <text x="95" y="235" class="mono">https://rf3-demo-ui.…</text>
  <rect x="95" y="250" width="265" height="26" class="chip"/>
  <text x="110" y="268" class="mono">提交 /fold，轮询 /jobs</text>

  <!-- UI -->
  <rect x="470" y="130" width="390" height="220" class="box"/>
  <text x="495" y="165" class="h">UI Container App（CPU）</text>
  <text x="495" y="190" class="t">FastAPI + HTML/JS</text>
  <text x="495" y="214" class="t">- 输入表单、日志面板、文件下载</text>
  <text x="495" y="236" class="t">- 3Dmol.js 本地静态资源渲染结构</text>
  <text x="495" y="260" class="t">- 反向代理到 Backend（RF3_API_BASE_URL）</text>
  <rect x="495" y="286" width="330" height="26" class="chip"/>
  <text x="510" y="304" class="mono">/health /fold /jobs/*</text>

  <!-- Backend -->
  <rect x="970" y="130" width="360" height="260" class="box"/>
  <text x="995" y="165" class="h">Backend Container App（A100 GPU）</text>
  <text x="995" y="190" class="t">FastAPI + Uvicorn</text>
  <text x="995" y="214" class="t">- /fold 触发 rf3 fold 推理</text>
  <text x="995" y="236" class="t">- GPU 任务串行（全局锁）</text>
  <text x="995" y="258" class="t">- /jobs/{id} 返回状态与文件列表</text>
  <text x="995" y="280" class="t">- /jobs/{id}/files 下载产物</text>
  <text x="995" y="302" class="t">- /jobs/{id}/logs 实时 tail</text>
  <rect x="995" y="328" width="310" height="26" class="chip"/>
  <text x="1010" y="346" class="mono">输出: predicted.cif/pdb</text>

  <!-- Optional Azure Files -->
  <rect x="970" y="450" width="360" height="190" class="box"/>
  <text x="995" y="485" class="h">可选：Azure Files（/models）</text>
  <text x="995" y="510" class="t">用于缓存 RF3 checkpoint</text>
  <text x="995" y="534" class="t">减少冷启动下载时间</text>
  <rect x="995" y="560" width="310" height="26" class="chip"/>
  <text x="1010" y="578" class="mono">RF3_CKPT_PATH=/models/rf3.ckpt</text>

  <!-- ACR / IaC -->
  <rect x="470" y="410" width="390" height="230" class="box"/>
  <text x="495" y="445" class="h">构建与部署</text>
  <text x="495" y="470" class="t">- ACR build 构建镜像</text>
  <text x="495" y="492" class="t">- Bicep（infra/）创建/更新资源</text>
  <text x="495" y="514" class="t">- scripts/deploy.sh 支持 UI-only 更新</text>
  <rect x="495" y="540" width="330" height="26" class="chip"/>
  <text x="510" y="558" class="mono">UI: DEPLOY_APP=false</text>

  <!-- Arrows -->
  <path class="arrow" d="M390 215 C420 215, 430 215, 470 215"/>
  <path class="arrow" d="M860 230 C900 230, 920 230, 970 230"/>

  <!-- Optional cache arrow -->
  <path class="dashed" d="M1150 390 C1150 415, 1150 425, 1150 450"/>

  <!-- Notes -->
  <text x="70" y="705" class="subtitle">注：该 Demo 将 UI 与推理解耦，降低 UI 成本（CPU），同时让推理服务独占 A100（serverless GPU）。</text>
</svg>
